<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    html, body {
        margin: 0;
        padding: 0;
        background: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
    }

    .page {
        padding: 6px;
    }

    .instructions {
        margin-bottom: 18px;
        font-size: 14px;
        color: #111111;
    }

    .signature {
        border-collapse: collapse;
        background: #0B0B0C;
        color: #F4F1EC;
    }

    .logo-cell {
        vertical-align: middle;
        padding: 24px 28px 24px 22px;
    }

    .logo-cell img {
        width: 230px;
        height: auto;
        display: block;
        border: 0;
    }

    .divider-cell {
        width: 1px;
        background: #9A9A9A;
    }

    .details-cell {
        vertical-align: middle;
        padding: 24px 28px;
        min-width: 340px;
    }

    .name {
        font-size: 28px;
        line-height: 1.12;
        font-weight: 700;
        color: #F4F1EC;
        margin: 0 0 7px 0;
    }

    .role {
        font-size: 15px;
        line-height: 1.35;
        font-weight: 600;
        color: #F4F1EC;
        margin: 0;
    }

    .company {
        font-size: 15px;
        line-height: 1.35;
        font-weight: 600;
        color: #F4F1EC;
        margin: 0;
    }

    .contact {
        margin-top: 22px;
        font-size: 14px;
        line-height: 1.55;
    }

    .contact a {
        color: #A6A6A6;
        text-decoration: none;
    }
</style>
</head>

<body>

<div class="page">

<div class="instructions">
Select the signature below, copy it, then paste it into Gmail.
</div><table class="signature" cellpadding="0" cellspacing="0" border="0">
<tr>

<td class="logo-cell">
    <img src="assets/arsc-logo.png" alt="AR Services Collective">
</td>

<td class="divider-cell"></td>

<td class="details-cell">

    <div class="name">
        Caryl Joyce Y. Bacay
    </div>

    <div class="role">
        Co-Founder / Operations Lead
    </div>

    <div class="company">
        AR Services Collective
    </div>

    <div class="contact">

        <div>
            <a href="mailto:caryl@arservicescollective.com">
                caryl@arservicescollective.com
            </a>
        </div>

        <div>
            <a href="https://arservicescollective.com">
                arservicescollective.com
            </a>
        </div>

    </div>

</td>

</tr>
</table></div>

</body>
</html>
